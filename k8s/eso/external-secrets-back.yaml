apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-back-certs
  namespace: demo-back
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kafka-secrets
    kind: ClusterSecretStore
  target:
    name: kafka-back-certs
    creationPolicy: Owner
  data:
    - secretKey: user.p12
      remoteRef:
        key: back
        property: user.p12
    - secretKey: ca.p12
      remoteRef:
        key: demo-cluster-ca-cert
        property: ca.p12
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-back-passwords
  namespace: demo-back
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kafka-secrets
    kind: ClusterSecretStore
  target:
    name: kafka-back-passwords
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SPRING_KAFKA_SSL_KEY_STORE_PASSWORD: "{{ .userPassword }}"
        SPRING_KAFKA_SSL_KEY_PASSWORD: "{{ .userPassword }}"
        SPRING_KAFKA_SSL_TRUST_STORE_PASSWORD: "{{ .caPassword }}"
  data:
    - secretKey: userPassword
      remoteRef:
        key: back
        property: user.password
    - secretKey: caPassword
      remoteRef:
        key: demo-cluster-ca-cert
        property: ca.password
