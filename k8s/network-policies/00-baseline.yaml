apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - ipBlock:
            cidr: 10.30.0.0/20
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-k8s-api
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.30.0.0/20
        - ipBlock:
            cidr: 172.16.0.0/28
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
# Tightly-coupled multi-pod components (Strimzi Kafka broker <-> entity-operator,
# CNPG primary <-> replicas) need to talk within their own namespace. The
# default-deny applies per-pod, so we open intra-namespace egress explicitly.
# Cross-namespace traffic still requires its own NP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector: {}
---
# GKE Workload Identity: pods exchange their KSA for a GCP token by hitting the
# node-local gke-metadata-server proxy at 169.254.169.254. Without this rule the
# default-deny + internet-egress (which excepts link-local) traps WI clients
# (kaniko -> Artifact Registry, ESO -> Secret Manager). Pods still need a WI
# binding on their KSA to receive a usable token; this only opens the path.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-metadata-server
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 988
---
# cert-manager spins up an ephemeral cm-acme-http-solver pod in the same
# namespace as the Certificate. ingress-nginx then routes the LE HTTP-01
# challenge to it. Without this rule the per-namespace default-deny
# leaves the solver unreachable and every cert stays pending.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-acme-solver
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
