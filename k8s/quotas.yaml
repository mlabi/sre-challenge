# LimitRange + ResourceQuota per managed namespace.
#
# LimitRange: defense-in-depth — every container in the namespace gets
# sensible defaults applied if it omits resources, plus a hard 'max' so
# nothing can ask for more than the node can give. Apps that already
# declare requests/limits in their chart keep what they declared.
#
# ResourceQuota: hard cap per namespace, applied only to the demo-*
# tenants. Kafka, Postgres, Jenkins and platform components are left
# uncapped because their footprint is large and known (Strimzi/CNPG/Jenkins
# pods all carry explicit requests in their own manifests).

# ─── Demo apps (front / back / reader) ──────────────────────────────────
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: demo-front
spec:
  limits:
    - type: Container
      default:        { cpu: 500m, memory: 512Mi }
      defaultRequest: { cpu: 100m, memory: 128Mi }
      max:            { cpu: "2",  memory: 2Gi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: demo-front
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: demo-back
spec:
  limits:
    - type: Container
      default:        { cpu: 500m, memory: 512Mi }
      defaultRequest: { cpu: 100m, memory: 128Mi }
      max:            { cpu: "2",  memory: 2Gi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: demo-back
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: demo-reader
spec:
  limits:
    - type: Container
      default:        { cpu: 500m, memory: 512Mi }
      defaultRequest: { cpu: 100m, memory: 128Mi }
      max:            { cpu: "2",  memory: 2Gi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: demo-reader
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "5"

# ─── Platform / data plane (LimitRange only — no hard quota) ────────────
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: kafka
spec:
  limits:
    - type: Container
      default:        { cpu: "1",  memory: 1Gi }
      defaultRequest: { cpu: 200m, memory: 256Mi }
      max:            { cpu: "4",  memory: 4Gi }
---
