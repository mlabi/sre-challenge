---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: jenkins-build
---
# Build-agent spawner: the controller SA reconciles transient kaniko/gradle
# pods in jenkins-build. exec/log/portforward are needed by the kubernetes
# plugin for log streaming and live debug into agent containers.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: build-agent-spawner
  namespace: jenkins-build
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "serviceaccounts", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-build-agent-spawner
  namespace: jenkins-build
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
roleRef:
  kind: Role
  name: build-agent-spawner
  apiGroup: rbac.authorization.k8s.io
---
# Deployer: bound to the build-pod SA so 'helm upgrade --install' from the
# pipeline can reconcile every object our chart renders. Wildcards were
# replaced with the explicit set helm actually uses, blocking pod/exec and
# pod/portforward escalation paths and bind/escalate on Roles.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: demo-front
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
      - secrets
      - serviceaccounts
      - persistentvolumeclaims
      - events
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: demo-front
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins         # controller-side (legacy: make jenkins-triggered deploys)
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins-build   # build pod runs helm install
roleRef:
  kind: Role
  name: deployer
  apiGroup: rbac.authorization.k8s.io
---
