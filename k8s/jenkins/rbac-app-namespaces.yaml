---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: jenkins-build
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: build-agent-spawner
  namespace: jenkins-build
rules:
  - apiGroups: [""]
    resources: ["pods","pods/log","pods/exec","pods/portforward"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["secrets","configmaps","serviceaccounts","events"]
    verbs: ["get","list","watch","create","update","patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-build-agent-spawner
  namespace: jenkins-build
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
roleRef:
  kind: Role
  name: build-agent-spawner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: demo-front
rules:
  - apiGroups: [""]
    resources: ["pods","services","configmaps","secrets","serviceaccounts","persistentvolumeclaims","events"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments","replicasets","statefulsets"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses","networkpolicies"]
    verbs: ["*"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["*"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: demo-front
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins         # controller, for legacy make-triggered deploys
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins-build   # build pod runs helm
roleRef:
  kind: Role
  name: deployer
  apiGroup: rbac.authorization.k8s.io
---
