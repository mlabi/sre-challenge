{{- if .Values.networkPolicies.allowIngressFromNginx -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.fullname" . }}-allow-ingress-nginx
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jenkins-build
      ports:
        - protocol: TCP
          port: {{ .Values.ports.http }}
{{- end }}
{{- range .Values.networkPolicies.egressAllows }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.fullname" $ }}-egress-{{ .name }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selectorLabels" $ | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        {{- toYaml .to | nindent 8 }}
      {{- with .ports }}
      ports:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
