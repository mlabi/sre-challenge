---

- name: App-side secrets via ESO
  hosts: localhost
  gather_facts: false

  environment:
    KUBECONFIG: "{{ k3s_kubeconfig }}"

  vars:
    repo_root: "{{ playbook_dir }}/../../.."

  tasks:

    - name: Apply namespaces (with registry-pull-needed label)
      ansible.builtin.command:
        cmd: kubectl apply -f {{ repo_root }}/k8s/namespaces.yaml
      changed_when: true

    - name: Apply kafka-secrets ClusterSecretStore + RBAC
      ansible.builtin.command:
        cmd: kubectl apply -f {{ repo_root }}/k8s/eso/secret-store-kafka.yaml
      changed_when: true

    - name: Wait for kafka-secrets ClusterSecretStore Ready
      ansible.builtin.command:
        cmd: kubectl wait clustersecretstore/kafka-secrets --for=condition=Ready --timeout=2m
      changed_when: false

    - name: Apply front-side ExternalSecrets (Kafka mTLS certs + passwords)
      ansible.builtin.command:
        cmd: kubectl apply -f {{ repo_root }}/k8s/eso/external-secrets-front.yaml
      changed_when: true

    - name: Apply back-side ExternalSecrets (Kafka mTLS certs + passwords)
      ansible.builtin.command:
        cmd: kubectl apply -f {{ repo_root }}/k8s/eso/external-secrets-back.yaml
      changed_when: true

    - name: Render registry-pull ClusterExternalSecret (registry_host from group_vars)
      ansible.builtin.template:
        src: "{{ repo_root }}/k8s/eso/cluster-external-secret-registry-pull.yaml.j2"
        dest: /tmp/cluster-external-secret-registry-pull.yaml
        mode: "0644"

    - name: Apply registry-pull ClusterExternalSecret
      ansible.builtin.command:
        cmd: kubectl apply -f /tmp/cluster-external-secret-registry-pull.yaml
      changed_when: true

    - name: Wait for ExternalSecrets in demo-front
      ansible.builtin.command:
        cmd: kubectl -n demo-front wait externalsecret/{{ item }} --for=condition=Ready --timeout=2m
      loop:
        - kafka-front-certs
        - kafka-front-passwords
        - registry-pull
      changed_when: false

    - name: Wait for ExternalSecrets in demo-back
      ansible.builtin.command:
        cmd: kubectl -n demo-back wait externalsecret/{{ item }} --for=condition=Ready --timeout=2m
      loop:
        - kafka-back-certs
        - kafka-back-passwords
        - registry-pull
      changed_when: false

    - name: Wait for ExternalSecret in demo-reader (registry-pull only — no Kafka)
      ansible.builtin.command:
        cmd: kubectl -n demo-reader wait externalsecret/registry-pull --for=condition=Ready --timeout=2m
      changed_when: false

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "ClusterSecretStore kafka-secrets ready — reads Secrets from 'kafka' ns"
          - "Cross-namespace ExternalSecrets created:"
          - "  demo-front: kafka-front-certs, kafka-front-passwords, registry-pull"
          - "  demo-back:  kafka-back-certs,  kafka-back-passwords,  registry-pull"
          - "  demo-reader: registry-pull"
          - ""
          - "Each app's helm install will also create its postgres-creds"
          - "ExternalSecret via the chart (defined in values-{back,reader}.yaml)."
