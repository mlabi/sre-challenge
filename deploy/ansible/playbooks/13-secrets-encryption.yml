---

- name: k3s secrets encryption at rest
  hosts: k3s_server
  become: true
  gather_facts: false

  tasks:
    - name: Ensure /etc/rancher/k3s directory exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure k3s with secrets-encryption enabled
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        content: |
          secrets-encryption: true
        owner: root
        group: root
        mode: "0644"
      register: k3s_config

    - name: Restart k3s if config changed
      ansible.builtin.systemd:
        name: k3s
        state: restarted
        daemon_reload: true
      when: k3s_config.changed

    - name: Wait for k3s API to respond after restart
      ansible.builtin.wait_for:
        port: 6443
        delay: 5
        timeout: 120

    - name: Check current encryption status
      ansible.builtin.command:
        cmd: k3s secrets-encrypt status
      register: encrypt_status
      changed_when: false

    - name: Show encryption status
      ansible.builtin.debug:
        var: encrypt_status.stdout_lines

    - name: Re-encrypt existing Secrets if still on plain text
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          stage=$(k3s secrets-encrypt status | awk -F: '/Current Rotation Stage/ {gsub(/^[ \t]+/, "", $2); print $2}')
          if [ "${stage}" = "start" ]; then
            echo "Rotating to encrypt existing Secrets…"
            k3s secrets-encrypt prepare
            systemctl restart k3s
            for i in $(seq 1 30); do
              ss -ltn '( sport = :6443 )' | grep -q ':6443' && break
              sleep 2
            done
            sleep 5
            k3s secrets-encrypt rotate
            systemctl restart k3s
            for i in $(seq 1 30); do
              ss -ltn '( sport = :6443 )' | grep -q ':6443' && break
              sleep 2
            done
            sleep 5
            k3s secrets-encrypt reencrypt
            echo "Re-encryption requested."
          else
            echo "Rotation stage is '${stage}' — skipping bulk re-encryption."
          fi
        executable: /bin/bash
      register: rotation
      changed_when: "'Rotating' in rotation.stdout"

    - name: Show rotation outcome
      ansible.builtin.debug:
        var: rotation.stdout_lines

    - name: Final encryption status
      ansible.builtin.command:
        cmd: k3s secrets-encrypt status
      register: final_status
      changed_when: false

    - name: Summary
      ansible.builtin.debug:
        var: final_status.stdout_lines
