---

- name: cert-manager + lab-ca ClusterIssuer
  hosts: localhost
  gather_facts: true   # need ansible_facts.os_family for the trust step

  environment:
    KUBECONFIG: "{{ k3s_kubeconfig }}"

  vars:
    repo_root: "{{ playbook_dir }}/../../.."

  tasks:
    - name: helm repo add jetstack
      ansible.builtin.command:
        cmd: helm repo add jetstack https://charts.jetstack.io
      register: r
      changed_when: "'already exists' not in r.stderr"
      failed_when:
        - r.rc != 0
        - "'already exists' not in r.stderr"

    - name: helm repo update
      ansible.builtin.command: helm repo update
      changed_when: false

    - name: Install cert-manager (CRDs included)
      ansible.builtin.command:
        cmd: >
          helm upgrade --install cert-manager jetstack/cert-manager
          --namespace cert-manager --create-namespace
          --version {{ cert_manager_version }}
          --set installCRDs=true
          --wait
      changed_when: true

    - name: Apply ClusterIssuers + lab CA Certificate
      ansible.builtin.command:
        cmd: kubectl apply -f {{ repo_root }}/k8s/cert-manager/cluster-issuer.yaml
      changed_when: true

    - name: Wait for lab-ca CA secret to be created (cert-manager signs it)
      ansible.builtin.command:
        cmd: kubectl -n cert-manager wait --for=condition=Ready certificate/lab-ca --timeout=2m
      changed_when: false

    - name: Wait for lab-ca ClusterIssuer Ready
      ansible.builtin.command:
        cmd: kubectl wait --for=condition=Ready clusterissuer/lab-ca --timeout=2m
      changed_when: false

    - name: Extract lab CA cert onto the controller
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          kubectl -n cert-manager get secret lab-ca-secret \
            -o 'jsonpath={.data.ca\.crt}' | base64 -d > /tmp/lab-ca.crt
        executable: /bin/bash
      changed_when: true

    - name: Copy lab CA to Debian/Ubuntu anchor dir
      ansible.builtin.copy:
        src: /tmp/lab-ca.crt
        dest: /usr/local/share/ca-certificates/sre-lab-ca.crt
        mode: "0644"
        owner: root
        group: root
      become: true
      register: deb_ca_copy
      when: ansible_facts.os_family == "Debian"

    - name: Refresh CA bundle (Debian/Ubuntu)
      ansible.builtin.command: update-ca-certificates
      become: true
      changed_when: true
      when:
        - ansible_facts.os_family == "Debian"
        - deb_ca_copy.changed

    - name: Copy lab CA to RHEL/Fedora anchor dir
      ansible.builtin.copy:
        src: /tmp/lab-ca.crt
        dest: /etc/pki/ca-trust/source/anchors/sre-lab-ca.crt
        mode: "0644"
        owner: root
        group: root
      become: true
      register: rh_ca_copy
      when: ansible_facts.os_family in ["RedHat", "Rocky"]

    - name: Refresh CA trust (RHEL/Fedora)
      ansible.builtin.command: update-ca-trust
      become: true
      changed_when: true
      when:
        - ansible_facts.os_family in ["RedHat", "Rocky"]
        - rh_ca_copy.changed

    - name: TLS sanity — does the lab CA verify itself
      ansible.builtin.command:
        cmd: openssl verify -CAfile /tmp/lab-ca.crt /tmp/lab-ca.crt
      changed_when: false

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "Lab CA trusted on this {{ ansible_facts.os_family }} host."
          - "https://jenkins.{{ ingress_base_domain }}/ should show a green padlock after browser restart."
          - "Firefox uses its own NSS store — import /tmp/lab-ca.crt via Settings > Privacy & Security > Certificates if you use Firefox."
