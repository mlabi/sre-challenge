---

- name: External Secrets Operator + Vault ClusterSecretStore
  hosts: localhost
  gather_facts: false

  environment:
    KUBECONFIG: "{{ k3s_kubeconfig }}"

  vars:
    repo_root: "{{ playbook_dir }}/../../.."

  tasks:
    - name: helm repo add external-secrets
      ansible.builtin.command:
        cmd: helm repo add external-secrets https://charts.external-secrets.io
      register: r
      changed_when: "'already exists' not in r.stderr"
      failed_when:
        - r.rc != 0
        - "'already exists' not in r.stderr"

    - name: helm repo update
      ansible.builtin.command: helm repo update
      changed_when: false

    - name: Install External Secrets Operator
      ansible.builtin.command:
        cmd: >
          helm upgrade --install external-secrets external-secrets/external-secrets
          --namespace external-secrets --create-namespace
          --version {{ eso_chart_version }}
          --set installCRDs=true
          --wait
      changed_when: true

    - name: Apply ClusterSecretStore (vault-backend)
      ansible.builtin.command:
        cmd: kubectl apply -f {{ repo_root }}/k8s/eso/cluster-secret-store.yaml
      changed_when: true

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "ESO running:           ns=external-secrets"
          - "ClusterSecretStore:    vault-backend (k8s auth → Vault role external-secrets)"
          - "Ready check deferred to 25-network-policies.yml (waits for NP allows)"
          - "Usage: create ExternalSecret resource referencing this store."
          - "Example path in Vault: secret/<app>/<credential> (KV v2)"
