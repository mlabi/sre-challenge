---

- name: k3s server (k3s_server group)
  hosts: k3s_server
  become: true
  gather_facts: false

  tasks:
    - name: Check if k3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: Install k3s server
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_CHANNEL={{ k3s_channel }} \
          INSTALL_K3S_EXEC="server --write-kubeconfig-mode=644 --tls-san={{ ansible_host }} --disable=traefik" \
          sh -
      args:
        creates: /usr/local/bin/k3s
      when: not k3s_bin.stat.exists

    - name: Wait for k3s API to respond
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        delay: 2
        timeout: 120

    - name: Read node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_raw

    - name: Stash token as fact
      ansible.builtin.set_fact:
        k3s_node_token: "{{ k3s_token_raw.content | b64decode | trim }}"

    - name: Read kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig_raw

    - name: Save kubeconfig on controller (rewrite server URL)
      ansible.builtin.copy:
        dest: "{{ lookup('env', 'HOME') }}/.kube/k3s-config"
        content: "{{ k3s_kubeconfig_raw.content | b64decode | replace('127.0.0.1', ansible_host) }}"
        mode: "0600"
      delegate_to: localhost
      become: false

- name: k3s agents (k3s_agent group)
  hosts: k3s_agent
  become: true
  gather_facts: false

  vars:
    server_host: "{{ hostvars[groups['k3s_server'][0]]['ansible_host'] }}"
    server_token: "{{ hostvars[groups['k3s_server'][0]]['k3s_node_token'] }}"

  tasks:
    - name: Check if k3s-agent is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: Install k3s agent
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_CHANNEL={{ k3s_channel }} \
          K3S_URL=https://{{ server_host }}:6443 \
          K3S_TOKEN={{ server_token }} \
          sh -
      args:
        creates: /usr/local/bin/k3s
      when: not k3s_bin.stat.exists

    - name: Wait for kubelet ready
      ansible.builtin.wait_for:
        port: 10250
        delay: 2
        timeout: 120

- name: Verify cluster
  hosts: localhost
  gather_facts: false
  vars:
    kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/k3s-config"

  tasks:
    - name: List nodes
      ansible.builtin.command: kubectl --kubeconfig {{ kubeconfig }} get nodes -o wide
      changed_when: false
      register: nodes_out

    - name: Show
      ansible.builtin.debug:
        var: nodes_out.stdout_lines

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "k3s API:      https://{{ hostvars[groups['k3s_server'][0]]['ansible_host'] }}:6443"
          - "kubeconfig:   {{ kubeconfig }}"
          - "Use with:     export KUBECONFIG={{ kubeconfig }}"
